  <rect x="237" y="254" width="148" height="75" rx="10" fill="#14263b" stroke="#6d849b" stroke-width="2"/>
  <rect x="251" y="265" width="46" height="42" rx="5" fill="#1c594f" stroke="#4ade80" stroke-width="2"/>
  <rect x="260" y="274" width="27" height="22" rx="3" fill="#0f2b2e" stroke="#6ee7b7"/>
  <circle cx="280" cy="286" r="3" fill="#a7f3d0"/>
  <g stroke="#f59e0b" stroke-width="3"><path d="M308 274 H368 M308 285 H368 M308 296 H368"/></g>
  <text x="311" y="316" fill="#b7d0e8" font-family="Arial,sans-serif" font-size="10">ESP32 + DRIVER</text>
