  <rect x="136" y="40" width="36" height="17" rx="4" fill="#38bdf8" stroke="#c6f1ff" stroke-width="2"/>
  <path d="M404 62 V25 H432 V62" fill="none" stroke="#9ab5cf" stroke-width="7" stroke-linecap="round"/>
  <rect x="400" y="40" width="36" height="17" rx="4" fill="#2dd4bf" stroke="#c6fff5" stroke-width="2"/>
  <path d="M154 60 V96 M418 60 V96" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 5"/>
