<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">EdgeFlex Smart Conveyor AI</title>
<desc id="desc">A dark industrial-style banner showing a conveyor monitoring dashboard, conveyor belt, IR sensors, ESP32 controller and motor driver.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1424"/><stop offset="1" stop-color="#132945"/></linearGradient>
  <linearGradient id="belt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#202f45"/><stop offset=".5" stop-color="#0c1523"/><stop offset="1" stop-color="#263a54"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
</defs>
<rect width="1200" height="520" rx="26" fill="url(#bg)"/>
<circle cx="1085" cy="72" r="175" fill="#1e4f74" opacity=".18"/>
<circle cx="1050" cy="450" r="220" fill="#2dd4bf" opacity=".05"/>
<rect x="42" y="38" width="6" height="108" rx="3" fill="url(#accent)"/>
<text x="70" y="68" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">EDGE AI  /  INDUSTRIAL MONITORING</text>
<text x="70" y="119" fill="#f8fafc" font-family="Arial,sans-serif" font-size="43" font-weight="700">EdgeFlex Smart Conveyor AI</text>
<text x="72" y="151" fill="#adc5df" font-family="Arial,sans-serif" font-size="19">Explainable monitoring · Embedded control · Fault diagnostics</text>
