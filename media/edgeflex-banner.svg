<circle cx="91" cy="197" r="5" fill="#34d399"/>
<text x="105" y="203" fill="#d4f6f5" font-family="Arial,sans-serif" font-size="14" font-weight="700">ESP32 + FLASK DASHBOARD + SENSORS</text>
<!-- dashboard panel -->
<rect x="62" y="246" width="500" height="226" rx="18" fill="#101e32" stroke="#304660" stroke-width="2"/>
<text x="86" y="277" fill="#eaf3ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">CONVEYOR AI CONTROL CENTER</text>
<rect x="86" y="294" width="138" height="64" rx="10" fill="#172941" stroke="#34516f"/>
<rect x="237" y="294" width="138" height="64" rx="10" fill="#172941" stroke="#34516f"/>
<rect x="388" y="294" width="150" height="64" rx="10" fill="#172941" stroke="#34516f"/>
<text x="100" y="315" fill="#83bce9" font-family="Arial,sans-serif" font-size="10" font-weight="700">PRODUCT COUNT</text>
<text x="100" y="345" fill="#f8fafc" font-family="Arial,sans-serif" font-size="27" font-weight="700">IR1 / IR2</text>
<text x="251" y="315" fill="#83bce9" font-family="Arial,sans-serif" font-size="10" font-weight="700">TEMPERATURE</text>
<text x="251" y="345" fill="#f8fafc" font-family="Arial,sans-serif" font-size="27" font-weight="700">°C</text>
<text x="402" y="315" fill="#83bce9" font-family="Arial,sans-serif" font-size="10" font-weight="700">TRANSIT / SPEED</text>
<text x="402" y="345" fill="#f8fafc" font-family="Arial,sans-serif" font-size="27" font-weight="700">m/s</text>
<rect x="86" y="374" width="452" height="72" rx="10" fill="#14273e" stroke="#304660"/>
<circle cx="108" cy="398" r="6" fill="#fbbf24"/>
<text x="124" y="403" fill="#f6d28c" font-family="Arial,sans-serif" font-size="13" font-weight="700">FAULT ANALYSIS</text>
<text x="105" y="427" fill="#b5cbe3" font-family="Arial,sans-serif" font-size="13">Sensor checks · Operator guidance · Experimental ML</text>
<!-- conveyor rollers and belt -->
<g transform="translate(610,190) scale(0.85)">
  <text x="0" y="-20" fill="#eaf3ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">PHYSICAL PROTOTYPE</text>
