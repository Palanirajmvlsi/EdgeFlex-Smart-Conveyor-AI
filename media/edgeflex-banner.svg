    <path d="M75 111 L75 198 M115 111 L115 198 M155 111 L155 198 M195 111 L195 198 M235 111 L235 198 M275 111 L275 198 M315 111 L315 198 M355 111 L355 198 M395 111 L395 198 M435 111 L435 198 M475 111 L475 198 M515 111 L515 198"/>
  </g>
